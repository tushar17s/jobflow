<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">

            ⚡ JobFlow

        </div>

        <div class="top-actions">

            <button id="refresh">

                Refresh

            </button>

        </div>

    </header>


    <main class="container">

        <!-- Toolbar -->

        <section class="toolbar">

            <input
                id="search"
                type="text"
                placeholder="Search role, company or location..."
            >

            <select id="sort">

                <option value="newest">

                    Newest

                </option>

                <option value="oldest">

                    Oldest

                </option>

                <option value="company">

                    Company

                </option>

                <option value="role">

                    Role

                </option>

                <option value="status">

                    Status

                </option>

            </select>

            <button id="clear">

                Clear

            </button>

        </section>


        <!-- Statistics -->

        <section class="stats">

            <div class="stat-card">

                <span>Total</span>

                <h2 id="totalJobs">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <span>Saved</span>

                <h2 id="savedJobs">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <span>Applied</span>

                <h2 id="appliedJobs">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <span>Interview</span>

                <h2 id="interviewJobs">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <span>Rejected</span>

                <h2 id="rejectedJobs">

                    0

                </h2>

            </div>

        </section>


        <!-- List Header -->

        <section class="table-header">

            <div>

                Job

            </div>

            <div>

                Platform

            </div>

            <div>

                Date

            </div>

            <div>

                Status

            </div>

            <div>

                Actions

            </div>

        </section>


        <!-- Jobs -->

        <section id="jobs-container">

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
